{% extends "base.html" %}

{% block title %}
Create Parameter
{% endblock %}

{% block content %}

<h2>

Create Parameter

</h2>

<p>

PLC Tag :

<b>

{{ tag.tag_name }}

</b>

</p>

<p>

Tag Index :

<b>

{{ array_index }}

</b>

</p>

<p>

PLC Array Index :

<b>

{{ array_index }}

</b>

</p>

<form method="POST">

<p>

Parameter Name

<br>

<input
type="text"
name="parameter_name"
required
>

</p>

<p>

Unit

<br>

<input
type="text"
name="unit"
>

</p>

<p>

Min Value

<br>

<input
type="number"
step="any"
name="min_value"
required
>

</p>

<p>

Max Value

<br>

<input
type="number"
step="any"
name="max_value"
required
>

</p>

<p>

Default Value

<br>

<input
type="number"
step="any"
name="default_value"
required
>

</p>

<button type="submit">

Create Parameter

</button>

</form>

{% endblock %}
