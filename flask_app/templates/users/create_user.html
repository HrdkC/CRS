{% extends "base.html" %}

{% block title %}
Create User
{% endblock %}

{% block content %}

<section class="recipe-workbench">

    <div class="workbench-hero">
        <div class="workbench-title">
            <span class="section-kicker">Administration</span>
            <h1>Create User</h1>
            <p>Create a CRS account with role-based access.</p>
        </div>
        <div class="workbench-actions">
            <a href="/users" class="crs-btn crs-btn-soft">Back To Users</a>
        </div>
    </div>

    <div class="workbench-card edit-parameter-panel">
        <div class="panel-heading">
            <span>User Details</span>
            <span class="status-badge status-info">Admin</span>
        </div>

        <form method="POST" class="parameter-edit-form">
            {% if error %}
            <p class="muted-text">
                <span class="status-badge status-danger">Blocked</span>
                {{ error }}
            </p>
            {% endif %}
            <label>
                <span>Username</span>
                <input type="text" name="username" required>
            </label>
            <label>
                <span>Password</span>
                <input type="password" name="password" required>
            </label>
            <label>
                <span>Role</span>
                <select name="role">
                    {% for role in role_options %}
                    <option>{{ role }}</option>
                    {% endfor %}
                </select>
            </label>
            <div class="form-action-row">
                <button type="submit" class="crs-btn crs-btn-primary">Create User</button>
                <a href="/users" class="crs-btn crs-btn-soft">Cancel</a>
            </div>
        </form>
    </div>

</section>

{% endblock %}
