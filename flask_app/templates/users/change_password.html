{% extends "base.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<h3>

    Change Password

</h3>

<hr>

<p>

    User:

    <strong>

        {{ username }}

    </strong>

</p>

{% if error %}

<p>

    <strong>

        {{ error }}

    </strong>

</p>

{% endif %}

<form method="POST">

    <p>

        New Password

    </p>

    <input
        type="password"
        name="new_password"
        required
    >

    <p>

        Confirm Password

    </p>

    <input
        type="password"
        name="confirm_password"
        required
    >

    <br><br>

    <button
        type="submit"
    >

        Change Password

    </button>

</form>

{% endblock %}
