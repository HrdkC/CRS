{% extends "base.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<section class="recipe-workbench">

    <div class="workbench-hero">
        <div class="workbench-title">
            <span class="section-kicker">Security</span>
            <h1>Change Password</h1>
            <p>{{ username }}</p>
        </div>
        <div class="workbench-actions">
            <a href="/users" class="crs-btn crs-btn-soft">Back To Users</a>
        </div>
    </div>

    {% if error %}
    <div class="workbench-card">
        <div class="panel-heading">
            <span>Password Error</span>
            <span class="status-badge status-danger">Error</span>
        </div>
        <p>{{ error }}</p>
    </div>
    {% endif %}

    <div class="workbench-card edit-parameter-panel">
        <div class="panel-heading">
            <span>New Password</span>
            <span class="status-badge status-info">Required</span>
        </div>

        <form method="POST" class="parameter-edit-form">
            <label>
                <span>New Password</span>
                <input type="password" name="new_password" required>
            </label>
            <label>
                <span>Confirm Password</span>
                <input type="password" name="confirm_password" required>
            </label>
            <div class="form-action-row">
                <button type="submit" class="crs-btn crs-btn-primary">Change Password</button>
                <a href="/users" class="crs-btn crs-btn-soft">Cancel</a>
            </div>
        </form>
    </div>

</section>

{% endblock %}
