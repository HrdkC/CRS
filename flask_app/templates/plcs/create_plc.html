{% extends "base.html" %}

{% block title %}
Create PLC
{% endblock %}

{% block content %}

<section class="recipe-workbench">

    <div class="workbench-hero">
        <div class="workbench-title">
            <span class="section-kicker">PLC Registry</span>
            <h1>Create PLC</h1>
            <p>Assign a controller to a machine-stage record.</p>
        </div>
        <div class="workbench-actions">
            <a href="/plcs" class="crs-btn crs-btn-soft">Back To PLCs</a>
        </div>
    </div>

    <div class="workbench-card">
        <div class="panel-heading">
            <span>PLC Details</span>
            <span class="status-badge status-info">Registry</span>
        </div>

        <form method="post" class="import-options-form">
            {{ csrf_input() }}
            <input type="hidden" name="return_to" value="{{ form.get('return_to', '') if form else request.args.get('return_to', '') }}">
            <label>
                <span>Stage</span>
                <select name="machine_stage_id" required>
                    {% for stage in stages %}
                    <option value="{{ stage.id }}" {% if form and form.get('machine_stage_id')|string == stage.id|string %}selected{% endif %}>{{ stage.machine_code }} - {{ stage.stage_type }}</option>
                    {% endfor %}
                </select>
            </label>
            <label><span>PLC Name</span><input type="text" name="plc_name" value="{{ form.get('plc_name', '') if form else '' }}" required maxlength="100"></label>
            <label><span>IP Address</span><input type="text" name="ip_address" value="{{ form.get('ip_address', '') if form else '' }}" required inputmode="decimal" maxlength="45"></label>
            <label><span>Controller Type</span><input type="text" name="controller_type" value="{{ form.get('controller_type', '') if form else '' }}" required maxlength="100"></label>
            <label><span>Firmware Revision</span><input type="text" name="firmware_revision"></label>
            <label><span>Program Revision</span><input type="text" name="program_revision"></label>
            <label><span>Processor Name</span><input type="text" name="processor_name"></label>
            <label><span>PLC Software</span><input type="text" name="plc_software"></label>
            <label><span>Description</span><input type="text" name="description"></label>
            <div class="form-action-row">
                <button type="submit" class="crs-btn crs-btn-primary">Create PLC</button>
                <a href="/plcs" class="crs-btn crs-btn-soft">Cancel</a>
            </div>
        </form>
    </div>

</section>

{% endblock %}
