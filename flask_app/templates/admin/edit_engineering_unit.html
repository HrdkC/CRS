{% extends "base.html" %}

{% block title %}
Edit Engineering Unit
{% endblock %}

{% block content %}

<section class="recipe-workbench">

    <div class="workbench-hero">
        <div class="workbench-title">
            <span class="section-kicker">Master Data</span>
            <h1>Edit Engineering Unit</h1>
            <p>{{ unit.unit_code }}</p>
        </div>
        <div class="workbench-actions">
            <a href="/engineering-units" class="crs-btn crs-btn-soft">Back To Units</a>
        </div>
    </div>

    <div class="workbench-card edit-parameter-panel">
        <div class="panel-heading">
            <span>Unit Details</span>
            <span class="status-badge status-info">Audit</span>
        </div>
        <form method="POST" class="parameter-edit-form">
            <label><span>Unit Code</span><input type="text" value="{{ unit.unit_code }}" disabled></label>
            <label><span>Description</span><input type="text" name="description" value="{{ unit.description }}" required></label>
            <div class="form-action-row">
                <button type="submit" class="crs-btn crs-btn-primary">Save Changes</button>
                <a href="/engineering-units" class="crs-btn crs-btn-soft">Cancel</a>
            </div>
        </form>
    </div>

</section>

{% endblock %}
